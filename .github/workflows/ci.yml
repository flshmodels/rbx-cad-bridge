name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -sL -o lune.zip   https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip
          curl -sL -o stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip
          curl -sL -o selene.zip https://github.com/Kampfkarren/selene/releases/download/0.32.0/selene-0.32.0-linux.zip
          curl -sL -o rojo.zip   https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          curl -sL -o lsp.zip    https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip
          for z in *.zip; do unzip -oq "$z"; done
          chmod +x lune stylua selene rojo luau-lsp
          curl -sL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.lua
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Lint (Selene)
        run: |
          selene generate-roblox-std
          selene src

      - name: Rojo build
        run: rojo build -o CadBridge.rbxl default.project.json

      - name: Type check (luau-lsp, Roblox definitions)
        run: |
          rojo sourcemap default.project.json -o sourcemap.json
          luau-lsp analyze --definitions="$HOME/bin/globalTypes.d.luau" --sourcemap=sourcemap.json src

      - name: Unit tests (Lune)
        run: lune run tests/run
